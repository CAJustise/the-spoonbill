<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spoonbill Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <a href="index.html" class="back-link">Back to Site</a>
    <img src="assets/spoonbill-logo-dark.png" alt="Spoonbill" class="login-logo">
    <h1>BOH Admin Login</h1>
    <p class="login-copy">Access team management, scheduling, reservations, classes, and private event operations.</p>

    <form id="admin-login-form" class="stack-form login-form">
      <label>Password
        <input id="admin-password" name="password" type="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="button button-primary full">Enter BOH</button>
      <p id="login-message" class="login-message" aria-live="polite"></p>
    </form>

    <div class="login-help">
      <h2>Need Access?</h2>
      <p>Default password is <code>spoonbill-admin</code> until changed in BOH settings.</p>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="admin-login.js"></script>
</body>
</html>
